<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>八珍录 · 中国八大菜系食谱</title>
  <link rel="icon" href="assets/img/icon.ico">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- 顶栏装饰横线 -->
  <div class="top-stele" aria-hidden="true"></div>

  <div class="app">

    <!-- 顶部导航 -->
    <header class="header">
      <button class="brand" data-route="/home" aria-label="回到首页">
        <span class="brand-seal">八</span>
        <span class="brand-text">
          <strong>八珍录</strong>
          <small>中国八大菜系食谱典藏</small>
        </span>
      </button>

      <div class="header-actions">
        <button class="icon-btn" id="favoriteBtn" data-route="/favorites" aria-label="我的收藏">
          <svg class="heart" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M12 21s-7.5-4.7-10-9C.6 8.3 2.5 4 6.3 4c2.4 0 3.8 1.2 5.7 3.4C13.9 5.2 15.3 4 17.7 4c3.8 0 5.7 4.3 3.7 8-2.5 4.3-9.4 9-9.4 9z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
          <span>我的收藏</span>
          <span class="badge" id="favoriteCount" hidden>0</span>
        </button>
      </div>
    </header>

    <!-- 搜索区 -->
    <section class="search-wrap">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <line x1="16" y1="16" x2="20" y2="20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索菜名，如「宫保鸡丁」「鱼香肉丝」…" autocomplete="off">
        <button class="clear-btn" id="clearSearch" aria-label="清空" hidden>×</button>
      </div>
    </section>

    <!-- 主视图容器 -->
    <main class="main" id="viewRoot"></main>

    <!-- 菜系切换底栏 -->
    <nav class="cuisine-dock" id="cuisineDock" aria-label="菜系切换"></nav>

  </div>

  <!-- 图片查看弹层 -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <img id="lightboxImg" src="" alt="">
    <button class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
  </div>

  <script src="assets/js/recipe/chuan/data.js"></script>
  <script src="assets/js/recipe/lu/data.js"></script>
  <script src="assets/js/recipe/yue/data.js"></script>
  <script src="assets/js/recipe/su/data.js"></script>
  <script src="assets/js/recipe/zhe/data.js"></script>
  <script src="assets/js/recipe/min/data.js"></script>
  <script src="assets/js/recipe/xiang/data.js"></script>
  <script src="assets/js/recipe/hui/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
